<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="t d">
  <title id="t">Mohammed Sabry · محمد صبري</title>
  <desc id="d">Full-Stack Developer. Name in English on the left and Arabic on the right, with a rotating 3D wireframe globe in the middle.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2440"/>
      <stop offset="0.55" stop-color="#1E3A5F"/>
      <stop offset="1" stop-color="#123A47"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#2DD4BF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#1F6F78" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0F2440" stop-opacity="0.15"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#CCFBF1" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="enClip">
      <text x="64" y="138" class="name">Mohammed Sabry</text>
    </clipPath>
    <clipPath id="frame"><rect width="1200" height="280" rx="18"/></clipPath>
  </defs>

  <style>
    .name { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 52px; font-weight: 700; letter-spacing: -0.4px; }
    .ar   { font-family: "Segoe UI", Tahoma, "Geeza Pro", "Noto Sans Arabic", Arial, sans-serif; font-size: 52px; font-weight: 700; }
    .sub  { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 21px; font-weight: 600; letter-spacing: 0.4px; }

    /* Entrance: English from the left, Arabic from the right */
    .enter-l, .enter-r { animation-duration: 1s; animation-timing-function: cubic-bezier(.2,.7,.2,1); animation-fill-mode: both; }
    .enter-l { animation-name: fromLeft; }
    .enter-r { animation-name: fromRight; }
    @keyframes fromLeft  { from { opacity: 0; transform: translateX(-36px); } to { opacity: 1; transform: none; } }
    @keyframes fromRight { from { opacity: 0; transform: translateX(36px); }  to { opacity: 1; transform: none; } }

    /* Shine sweeping across the English name */
    .sweep { animation: sweep 5.5s 1.2s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-180px); } 45%, 100% { transform: translateX(480px); } }

    /* Globe: meridians turn by scaling on X (cos curve), fading when they pass behind */
    .globe { animation: pop 1.1s .3s cubic-bezier(.2,.7,.2,1) both; transform-box: fill-box; transform-origin: center; }
    @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
    .m { transform-box: fill-box; transform-origin: center; animation: spin 9s linear infinite; }
    @keyframes spin {
      0%    { transform: scaleX(1);    opacity: .95; }
      12.5% { transform: scaleX(.707); opacity: .8; }
      25%   { transform: scaleX(0);    opacity: .55; }
      37.5% { transform: scaleX(-.707);opacity: .3; }
      50%   { transform: scaleX(-1);   opacity: .2; }
      62.5% { transform: scaleX(-.707);opacity: .3; }
      75%   { transform: scaleX(0);    opacity: .55; }
      87.5% { transform: scaleX(.707); opacity: .8; }
      100%  { transform: scaleX(1);    opacity: .95; }
    }
    .m2 { animation-delay: -1.125s; } .m3 { animation-delay: -2.25s; } .m4 { animation-delay: -3.375s; }
    .m5 { animation-delay: -4.5s; }   .m6 { animation-delay: -5.625s; } .m7 { animation-delay: -6.75s; } .m8 { animation-delay: -7.875s; }

    /* Tilted orbit with a satellite */
    .orbit-spin { transform-box: fill-box; transform-origin: center; animation: orbit 6s linear infinite; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: .75; transform: scale(1.08); } }

    /* Twinkling dots */
    .tw { animation: tw 3.6s ease-in-out infinite; }
    .tw2 { animation-delay: -1.2s; } .tw3 { animation-delay: -2.4s; }
    @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: .7; } }

    @media (prefers-reduced-motion: reduce) {
      .enter-l, .enter-r, .sweep, .globe, .m, .orbit-spin, .pulse, .tw { animation: none; }
      .sweep { opacity: 0; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="280" fill="url(#bg)"/>

    <!-- faint perspective grid at the bottom -->
    <g stroke="#2DD4BF" stroke-opacity=".07" stroke-width="1" fill="none">
      <path d="M0 230 H1200 M0 252 H1200 M0 274 H1200"/>
      <path d="M690 200 L80 280 M690 200 L300 280 M690 200 L460 280 M690 200 L740 280 M690 200 L900 280 M690 200 L1120 280"/>
    </g>

    <!-- dots -->
    <g fill="#99F6E4">
      <circle class="tw" cx="420" cy="48" r="1.6"/>
      <circle class="tw tw2" cx="780" cy="62" r="1.4"/>
      <circle class="tw tw3" cx="500" cy="232" r="1.3"/>
      <circle class="tw tw2" cx="712" cy="222" r="1.6"/>
      <circle class="tw tw3" cx="1080" cy="40" r="1.3"/>
      <circle class="tw" cx="130" cy="236" r="1.3"/>
    </g>

    <!-- English name with depth layers and shine -->
    <g class="enter-l">
      <text x="68" y="143" class="name" fill="#0B1B30">Mohammed Sabry</text>
      <text x="66.5" y="140.5" class="name" fill="#0F766E">Mohammed Sabry</text>
      <text x="64" y="138" class="name" fill="#FFFFFF">Mohammed Sabry</text>
      <g clip-path="url(#enClip)">
        <rect class="sweep" x="0" y="80" width="140" height="80" fill="url(#shine)"/>
      </g>
      <text x="66" y="180" class="sub" fill="#5EEAD4">Full-Stack Developer</text>
    </g>

    <!-- Globe -->
    <g class="globe">
      <circle cx="690" cy="140" r="122" fill="url(#glow)"/>
      <circle cx="690" cy="140" r="82" fill="url(#core)"/>
      <!-- latitudes -->
      <g fill="none" stroke="#5EEAD4" stroke-width="1.1" stroke-opacity=".45">
        <ellipse cx="690" cy="140" rx="82" ry="16"/>
        <ellipse cx="690" cy="111" rx="71" ry="13"/>
        <ellipse cx="690" cy="169" rx="71" ry="13"/>
        <ellipse cx="690" cy="86"  rx="47" ry="8.5"/>
        <ellipse cx="690" cy="194" rx="47" ry="8.5"/>
      </g>
      <!-- meridians -->
      <g fill="none" stroke="#99F6E4" stroke-width="1.3">
        <ellipse class="m m1" cx="690" cy="140" rx="82" ry="82"/>
        <ellipse class="m m2" cx="690" cy="140" rx="82" ry="82"/>
        <ellipse class="m m3" cx="690" cy="140" rx="82" ry="82"/>
        <ellipse class="m m4" cx="690" cy="140" rx="82" ry="82"/>
        <ellipse class="m m5" cx="690" cy="140" rx="82" ry="82"/>
        <ellipse class="m m6" cx="690" cy="140" rx="82" ry="82"/>
        <ellipse class="m m7" cx="690" cy="140" rx="82" ry="82"/>
        <ellipse class="m m8" cx="690" cy="140" rx="82" ry="82"/>
      </g>
      <circle cx="690" cy="140" r="82" fill="none" stroke="#CCFBF1" stroke-width="1.6" stroke-opacity=".8"/>
      <circle class="pulse" cx="690" cy="140" r="96" fill="none" stroke="#2DD4BF" stroke-width="1" stroke-dasharray="3 7"/>
      <!-- tilted orbit: squash a rotating group into an ellipse -->
      <g transform="translate(690 140) rotate(-18) scale(1 .3) translate(-690 -140)">
        <circle cx="690" cy="140" r="118" fill="none" stroke="#5EEAD4" stroke-opacity=".35" stroke-width="2.4"/>
        <g class="orbit-spin">
          <circle cx="690" cy="140" r="118" fill="none" stroke="none"/>
          <circle cx="808" cy="140" r="7" fill="#CCFBF1"/>
          <circle cx="808" cy="140" r="14" fill="#2DD4BF" fill-opacity=".25"/>
        </g>
      </g>
    </g>

    <!-- Arabic name with depth layers -->
    <g class="enter-r" direction="rtl">
      <text x="1140" y="143" class="ar" text-anchor="start" fill="#0B1B30">محمد صبري</text>
      <text x="1138.5" y="140.5" class="ar" text-anchor="start" fill="#0F766E">محمد صبري</text>
      <text x="1136" y="138" class="ar" text-anchor="start" fill="#FFFFFF">محمد صبري</text>
      <text x="1134" y="180" class="sub" text-anchor="start" fill="#5EEAD4">Full-Stack Developer</text>
    </g>
  </g>
</svg>
