<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">Mohammed Sabry · محمد صبري</title>
  <desc id="d">Full-stack developer. Name written in English from the left and in Arabic from the right.</desc>
  <style>
    .bg { fill: #1F4D2F; }
    .name { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 60px; font-weight: 600; }
    .sub { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 22px; }
    .arf { font-family: "Segoe UI", Tahoma, "Geeza Pro", "Noto Sans Arabic", Arial, sans-serif; }
    .en, .ar { animation-duration: .9s; animation-timing-function: cubic-bezier(.2,.7,.2,1); animation-fill-mode: both; }
    .en { animation-name: fromLeft; }
    .ar { animation-name: fromRight; }
    .rule { transform-box: fill-box; transform-origin: center; animation: grow .6s .55s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes fromLeft  { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
    @keyframes fromRight { from { opacity: 0; transform: translateX(28px); }  to { opacity: 1; transform: none; } }
    @keyframes grow { from { opacity: 0; transform: scaleY(0); } to { opacity: 1; transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .en, .ar, .rule { animation: none; } }
  </style>
  <rect class="bg" width="1200" height="260" rx="18"/>
  <g class="en">
    <text class="name" x="64" y="132" fill="#FFFFFF">Mohammed Sabry</text>
    <text class="sub" x="66" y="176" fill="#CFE8D5">Full-Stack Developer</text>
  </g>
  <rect class="rule" x="598" y="70" width="4" height="120" rx="2" fill="#7FBF95"/>
  <g class="ar" direction="rtl">
    <text class="name arf" x="1136" y="132" text-anchor="start" fill="#FFFFFF">محمد صبري</text>
    <text class="sub arf" x="1134" y="176" text-anchor="start" fill="#CFE8D5">Full-Stack Developer</text>
  </g>
</svg>
